[package]
name = "ab-mcp"
version.workspace = true
edition.workspace = true
description = "MCP server（rmcp）：stdio + 本地回环 Streamable HTTP；工具面映射 broker/state，零业务规则"

[dependencies]
serde.workspace = true
serde_json.workspace = true
ab-contract = { path = "../contract" }
ab-crypto = { path = "../crypto" }
ab-broker = { path = "../broker" }
ab-state = { path = "../state" }
rmcp = { version = "1.8", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net"] }
axum = "0.8"

[dev-dependencies]
ab-audit = { path = "../audit" }
