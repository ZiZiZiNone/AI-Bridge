[package]
name = "ab-desktop"
version = "0.1.0"
edition = "2021"
description = "AI-Bridge Windows 桌面端（Tauri 2 宿主层，薄入口）"
publish = false

# 独立 workspace：仓库根 Cargo.toml 的 members 仅为 core/*，本 crate 不入其 members，
# 也不改动根清单（本任务写 scope 仅 desktop/）。待根清单纳入本包后，可删除本表并把
# 依赖改为 workspace = true（serde / serde_json 与根 workspace 版本线一致）。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 2026-10-12 起已编译验证：tauri 2.12.3（经 tools/fetch-vendor.py vendored 依赖离线解析），
# cargo test 22/22 通过。运行时行为（真实 WebView / IPC / 托盘）仍未验证，见 desktop/README.md。
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
