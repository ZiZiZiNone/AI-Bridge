[package]
name = "ab-desktop"
version = "0.1.0"
edition = "2021"
description = "AI-Bridge Windows 桌面端（Tauri 2 宿主层，薄入口）"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab-contract = { path = "../../core/contract" }
ab-crypto = { path = "../../core/crypto" }
ab-converter = { path = "../../core/converter-host" }
ab-state = { path = "../../core/state" }
ab-audit = { path = "../../core/audit" }
ab-broker = { path = "../../core/broker" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
